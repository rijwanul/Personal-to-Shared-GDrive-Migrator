<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; padding: 15px; color: #333; margin: 0; }
      label { font-weight: bold; display: block; margin-bottom: 8px; }
      input[type="text"] {
        width: 100%; padding: 10px; box-sizing: border-box;
        border: 1px solid #ccc; border-radius: 4px; font-size: 14px; margin-bottom: 15px;
      }
      button {
        background-color: #1a73e8; color: white; border: none;
        padding: 10px 18px; font-size: 14px; border-radius: 4px; cursor: pointer; width: 100%;
      }
      button:disabled { background-color: #ccc; cursor: not-allowed; }
      #status {
        margin-top: 15px; padding: 12px; border-radius: 4px;
        display: none; font-size: 14px; line-height: 1.4;
      }
      .open-btn {
        display: inline-block; margin-top: 10px; padding: 8px 12px;
        background-color: #34a853; color: white; text-decoration: none;
        border-radius: 4px; font-weight: bold; text-align: center;
      }
    </style>
  </head>
  <body>
    <label for="folderUrl">Enter Target Folder URL:</label>
    <input type="text" id="folderUrl" placeholder="https://drive.google.com/drive/folders/..." />

    <button id="moveBtn" onclick="startMoving()">Move Files/Folders</button>

    <div id="status"></div>

    <script>
      function startMoving() {
        var folderUrl = document.getElementById("folderUrl").value.trim();
        var statusDiv = document.getElementById("status");
        var btn = document.getElementById("moveBtn");

        if (!folderUrl) {
          alert("Please enter a Target Folder URL.");
          return;
        }

        btn.disabled = true;
        btn.innerText = "Processing...";
        statusDiv.style.display = "block";
        statusDiv.style.backgroundColor = "#e8f0fe";
        statusDiv.style.color = "#1a73e8";
        statusDiv.innerText = "Moving items from B2 onwards, please wait...";

        google.script.run
          .withSuccessHandler(function(res) {
            if (res.error) {
              btn.disabled = false;
              btn.innerText = "Move Files/Folders";
              statusDiv.style.backgroundColor = "#ffebee";
              statusDiv.style.color = "#c62828";
              statusDiv.innerText = "Error: " + res.error;
              return;
            }

            statusDiv.style.backgroundColor = "#e8f5e9";
            statusDiv.style.color = "#2e7d32";
            statusDiv.innerHTML = "<strong>Completed!</strong><br>" +
              "Successfully moved: " + res.successCount + " item(s)<br>" +
              (res.failCount > 0 ? "Failed/Skipped: " + res.failCount + "<br>" : "") +
              "<br><a class='open-btn' href='" + res.folderUrl + "' target='_blank'>Open Target Folder ↗</a>";

            btn.innerText = "Done";
          })
          .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.innerText = "Move Files/Folders";
            statusDiv.style.backgroundColor = "#ffebee";
            statusDiv.style.color = "#c62828";
            statusDiv.innerText = "System Error: " + err.message;
          })
          .processSheetMoveRequests(folderUrl);
      }
    </script>
  </body>
</html>
